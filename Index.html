<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Controle de Cotas</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-bottom:20px}
h1{color:#22c55e;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #334155}
th{color:#22c55e}
input{width:95%;padding:12px;border-radius:8px;border:none;margin:6px 0}
.btn{background:#22c55e;color:#000;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.meta{color:#fbbf24;font-weight:bold}
</style>
</head>
<body>
<h1>💰 Meu Controle de Cotas</h1>
<div class="card">
<h2>📊 Meus FIIs</h2>
<table>
<tr><th>FII</th><th>Qtd</th><th>Renda</th></tr>
<tr><td>HGLG11</td><td>100</td><td>R$ 80,00</td></tr>
<tr><td>MXRF11</td><td>200</td><td>R$ 20,00</td></tr>
</table>
</div>
<div class="card">
<h2>🎯 Metas</h2>
<p class="meta">R$ 1.000/mês = 1.250 cotas</p>
<p class="meta">R$ 5.000/mês = 6.250 cotas</p>
<p>Formula: Renda = Qtd x Dividendo</p>
</div>
<div class="card">
<h2>🧮 Calculadora</h2>
<input id="qtd" type="number" placeholder="Qtd de cotas">
<input id="div" type="number" step="0.01" placeholder="Dividendo ex: 0.80">
<button class="btn" onclick="calc()">Calcular Renda</button>
<p id="res" style="margin-top:12px;font-size:18px;font-weight:bold"></p>
</div>
<script>
function calc(){
let q=document.getElementById('qtd').value;
let d=document.getElementById('div').value;
let r=q*d;
document.getElementById('res').innerHTML="💵 Renda: R$ "+r.toFixed(2)+"/mês";
}
</script>
</body>
</html>
