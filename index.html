<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Sistema</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:18px;border-radius:12px;margin:12px 0}
h1{color:#22c55e;text-align:center}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #334155}
th{color:#22c55e}
input{width:95%;padding:12px;border-radius:8px;border:0;margin:6px 0}
.btn{background:#22c55e;color:#000;padding:14px;width:100%;border:0;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<h1>Meu Controle de Cotas</h1>
<div class="card">
<h3>Meus FIIs</h3>
<table>
<tr><th>FII</th><th>Qtd</th><th>Renda</th></tr>
<tr><td>HGLG11</td><td>100</td><td>R$80</td></tr>
<tr><td>MXRF11</td><td>200</td><td>R$20</td></tr>
</table>
</div>
<div class="card">
<h3>Calculadora</h3>
<input id="q" type="number" placeholder="Qtd cotas">
<input id="d" type="number" step="0.01" placeholder="Dividendo ex 0.80">
<button class="btn" onclick="calc()">Calcular Renda</button>
<p id="r" style="font-size:18px;font-weight:bold;margin-top:10px"></p>
</div>
<script>
function calc(){
let q=document.getElementById('q').value;
let d=document.getElementById('d').value;
document.getElementById('r').innerHTML="Renda: R$ "+(q*d).toFixed(2);
}
</script>
</body>
</html>
